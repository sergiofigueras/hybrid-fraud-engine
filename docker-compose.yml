services:
  fraud-engine:
    build:
      context: .
    image: hybrid-fraud-engine:local
    environment:
      FRAUD_MODEL_PATH: /app/artifacts/fraud_model.joblib
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
