[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-fraud-engine"
version = "1.1.0"
description = "A GitHub-ready deterministic plus machine-learning financial fraud evaluation engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Sergio Luiz Wermuth" },
]
keywords = [
  "artificial-intelligence",
  "fraud-detection",
  "machine-learning",
  "fastapi",
  "scikit-learn",
  "responsible-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi==0.128.2",
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pydantic==2.13.4",
  "scikit-learn==1.8.0",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
]

[project.scripts]
fraud-evaluate = "fraud_engine.cli:main"
fraud-demo = "training.demo:main"
fraud-generate-data = "training.generate_data:main"
fraud-train = "training.train:main"

[project.urls]
Homepage = "https://github.com/sergiofigueras/hybrid-fraud-engine"
Repository = "https://github.com/sergiofigueras/hybrid-fraud-engine"
Issues = "https://github.com/sergiofigueras/hybrid-fraud-engine/issues"

[tool.setuptools.packages.find]
include = ["fraud_engine*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["fraud_engine", "training"]

[tool.coverage.report]
show_missing = true
skip_covered = true
